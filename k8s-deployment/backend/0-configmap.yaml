apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: backend-product
data:
  MAIL_HOST: smtp.gmail.com
  MAIL_PORT: "587"
  MAIL_USER: octaltask.service@gmail.com
  MAIL_PASSWORD: <path:secret/data/product/backend#MAIL_PASSWORD>
  MAIL_FROM: noreply@heartistry.com
  DB_TYPE: mysql
  DB_HOST: mysql.mysql-product.svc.cluster.local
  DB_PORT: "3306"
  DB_USERNAME: <path:secret/data/product/backend#DB_USERNAME>
  DB_PASSWORD: <path:secret/data/product/backend#DB_PASSWORD>
  DB_DATABASE: <path:secret/data/product/backend#DB_DATABASE>
  DB_ROOT_PASSWORD: <path:secret/data/product/backend#DB_ROOT_PASSWORD>
  JWT_SECRET: <path:secret/data/product/backend#JWT_SECRET>
  TOKEN_EXPIRE_TIME: 24h
  SERVER_PORT: "3000"
  AUTH_PORT: "50051"
  TASK_PORT: "50052"
  USER_PORT: "50053"
  FRONTEND_BASE_URL: <path:secret/data/product/backend#FRONTEND_BASE_URL>
  CLIENT_GRPC_AUTH_URL: auth-service:50051
  CLIENT_GRPC_TASK_URL: task-service:50052
  CLIENT_GRPC_USER_URL: user-service:50053
  GRPC_SERVER_AUTH_URL: auth-service:50051
  GRPC_SERVER_TASK_URL: task-service:50052
  GRPC_SERVER_USER_URL: user-service:50053
  GRPC_LISTEN_AUTH_URL: 0.0.0.0:50051
  GRPC_LISTEN_TASK_URL: 0.0.0.0:50052
  GRPC_LISTEN_USER_URL: 0.0.0.0:50053
  TAG: v3.0