apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: database-mysql-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RibunLoc/DevOps-task-management-gitops.git
    targetRevision: develop
    path: k8s-deployment/database
    plugin:
      name: argocd-vault-plugin
  destination: 
    server: https://kubernetes.default.svc
    namespace: mysql-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true