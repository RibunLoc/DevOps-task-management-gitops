apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: frontend-product
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RibunLoc/DevOps-task-management-gitops.git
    targetRevision: product
    path: k8s-deployment/frontend
    plugin:
      name: argocd-vault-plugin
  destination:
    server: https://kubernetes.default.svc
    namespace: frontend-product
  syncPolicy:
    automated:
      prune: true
      selfHeal: true